services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - APP_ENV=production
    container_name: fursgo-app-prod
    ports:
      - "80:80"
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    networks:
      - fursgo-prod-network
    restart: unless-stopped
    # No volume mounts in production (immutable container)

networks:
  fursgo-prod-network:
    driver: bridge
