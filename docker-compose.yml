services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fursgo-app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
    networks:
      - fursgo-network

volumes:
  mysql-data:

networks:
  fursgo-network:
    driver: bridge
